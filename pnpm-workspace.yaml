packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  # HyperFrames' AI features (background removal, Gemini) are not used; rendering does not need these scripts
  '@google/genai': false
  onnxruntime-node: false
  protobufjs: false
  # Prisma downloads its migration engine on install
  '@prisma/engines': true
  prisma: true
  # optional native speed-up for BullMQ's msgpack; the JS fallback is fine
  msgpackr-extract: false
  # Next.js: image optimization and the resolver's native build are not needed
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - next@16.3.8
