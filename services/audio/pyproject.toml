[project]
name = "frameflow-audio"
version = "0.1.0"
description = "Frameflow audio service: TTS (Kokoro), forced alignment (WhisperX), beat detection (librosa)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.20",
  "numpy",
  "scipy",
  "soundfile>=0.12",
  "librosa>=0.11",
  "kokoro>=0.9.4",
  "misaki[en]>=0.9.4",
  "whisperx>=3.4",
  "num2words>=0.5.14",
  # misaki needs this spaCy model; pinning it here stops it from trying to pip-install at runtime
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = ["httpx>=0.28"]

[tool.uv]
package = false
