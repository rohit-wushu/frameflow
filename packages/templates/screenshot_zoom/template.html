<style>
  .t-screenshot_zoom .wrap { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 3.4); }
  .t-screenshot_zoom .title { font-family: var(--heading-font); font-weight: 700; line-height: 1.08; letter-spacing: -0.02em; color: var(--text); }
  .t-screenshot_zoom .frame {
    position: relative; overflow: hidden; border-radius: calc(var(--u) * 2); border: 2px solid var(--line); background: var(--bg);
    box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 9) color-mix(in srgb, var(--bg) 70%, transparent);
  }
  .t-screenshot_zoom .cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .t-screenshot_zoom .cam img { display: block; width: 100%; height: 100%; }
  .t-screenshot_zoom .spot { position: absolute; border-radius: calc(var(--u) * 0.6); box-shadow: 0 0 0 calc(var(--u) * 400) color-mix(in srgb, var(--bg) 64%, transparent); opacity: 0; }
  .t-screenshot_zoom .ring { position: absolute; border-style: solid; border-color: var(--primary); opacity: 0; }
  .t-screenshot_zoom .callout {
    position: absolute; white-space: nowrap; padding: calc(var(--u) * 1.2) calc(var(--u) * 2.4); border-radius: 99px;
    background: var(--primary); color: var(--on-primary); font: 700 calc(var(--u) * 2.6) / 1 var(--body-font);
    box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 3) color-mix(in srgb, var(--bg) 50%, transparent);
  }
</style>
<script>
  FF.register("screenshot_zoom", function (ctx) {
    var h = ctx.h, A = h.A, c = ctx.content, tl = ctx.tl, u = ctx.u;
    var img = ctx.images[c.image] || { src: "", aspect: 1.6, regions: {} };
    var PRESET = { center: { x: 30, y: 28, w: 40, h: 44 }, top: { x: 0, y: 0, w: 100, h: 48 } };
    var region = (img.regions && img.regions[c.focus]) || PRESET[c.focus] || PRESET.center;

    var wrap = h.el("div", "wrap");
    var titleWords = [], titleH = 0;
    if (c.title) {
      var title = h.el("div", "title");
      var fs = h.fit(c.title, { width: ctx.W - 16 * u, lines: 2, size: 5.6 * u });
      title.style.fontSize = fs + "px";
      titleWords = h.words(title, c.title);
      wrap.append(title);
      titleH = fs * 2.3 + 3.4 * u;
    }
    var fw = Math.min(ctx.W - (ctx.format === "16:9" ? 16 : 12) * u, (ctx.H - 16 * u - titleH) * img.aspect);
    var fh = fw / img.aspect;
    var frame = h.el("div", "frame");
    frame.style.width = fw + "px";
    frame.style.height = fh + "px";
    var cam = h.el("div", "cam");
    cam.style.width = fw + "px";
    cam.style.height = fh + "px";
    var pic = h.el("img");
    pic.src = img.src;
    cam.append(pic);

    // the area in frame pixels, padded a little
    var pad = 1.2 * u;
    var rx = (region.x / 100) * fw - pad, ry = (region.y / 100) * fh - pad;
    var rw = (region.w / 100) * fw + 2 * pad, rh = (region.h / 100) * fh + 2 * pad;
    var s = Math.max(1.3, Math.min(3.2, Math.min((0.62 * fw) / rw, (0.62 * fh) / rh)));
    var tx = Math.min(0, Math.max(fw - fw * s, fw / 2 - (rx + rw / 2) * s));
    var ty = Math.min(0, Math.max(fh - fh * s, fh / 2 - (ry + rh / 2) * s));

    var spot = h.el("div", "spot"), ring = h.el("div", "ring");
    [spot, ring].forEach(function (e) {
      e.style.left = rx + "px";
      e.style.top = ry + "px";
      e.style.width = rw + "px";
      e.style.height = rh + "px";
    });
    ring.style.borderWidth = (0.5 * u) / s + "px";
    ring.style.borderRadius = (1 * u) / s + "px";
    cam.append(spot, ring);
    frame.append(cam);

    var callout = null;
    if (c.callout) {
      callout = h.el("div", "callout", c.callout);
      // under the zoomed area if there is room, else above it
      var cx = (rx + rw / 2) * s + tx;
      var below = (ry + rh) * s + ty + 2.2 * u;
      var top = below + 6 * u < fh ? below : ry * s + ty - 7.2 * u;
      var est = c.callout.length * 1.5 * u + 5 * u;
      callout.style.top = Math.max(1.5 * u, top) + "px";
      callout.style.left = Math.max(1.5 * u, Math.min(fw - est - 1.5 * u, cx - est / 2)) + "px";
      frame.append(callout);
    }
    wrap.append(frame);
    ctx.el.append(wrap);

    var t0 = ctx.t0, hit = ctx.accent;
    if (titleWords.length) A.reveal(titleWords, ctx.wordTimes(titleWords, t0 + 0.05, 0.05));
    tl.fromTo(frame, { autoAlpha: 0, y: 5 * u, scale: 0.96 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, t0 + 0.1);
    tl.fromTo(cam, { x: 0, y: 0, scale: 1 }, { x: tx, y: ty, scale: s, duration: 0.95, ease: "power3.inOut", immediateRender: false }, hit);
    tl.to(spot, { opacity: 1, duration: 0.5, ease: "power1.out" }, hit + 0.45);
    tl.fromTo(ring, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, hit + 0.7);
    if (callout) A.pop(callout, hit + 0.95, { from: 0.6 });
    // a gentle drift while it holds
    tl.to(cam, { x: tx - 0.8 * u, duration: Math.max(0.5, ctx.t1 - hit - 1), ease: "sine.inOut" }, hit + 0.95);
  });
</script>
